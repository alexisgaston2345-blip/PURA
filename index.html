<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PURA - Pedidos y Catálogo</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --border: #e2e8f0;
      --soft: #f8fafc;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --ok: #25d366;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }
    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .search {
      flex: 1;
      min-width: 220px;
      max-width: 400px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }
    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .cart-btn {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 750;
      background: var(--primary);
      color: white;
    }
    
    .hero {
      padding: 28px 16px;
      background: linear-gradient(135deg, #eff6ff, #ffffff);
      border-bottom: 1px solid var(--border);
    }
    .hero h1 { margin: 0 0 8px; font-size: 32px; }
    .hero p { margin: 0 0 16px; color: var(--muted); max-width: 720px; }
    .hero button {
      padding: 12px 18px; border: none; border-radius: 12px;
      background: var(--primary); color: white; cursor: pointer; font-weight: 700;
    }
    .filters {
      display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 24px;
    }
    .chip {
      padding: 10px 14px; border: 1px solid var(--border);
      background: white; border-radius: 999px; cursor: pointer; font-size: 14px;
    }
    .chip.active { background: var(--text); color: white; border-color: var(--text); }
    
    .section-title {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin: 24px 0 14px;
    }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
      display: flex; flex-direction: column; position: relative;
    }
    .card-img {
      height: 180px; background: #f1f5f9; display: flex; align-items: center;
      justify-content: center; overflow: hidden; position: relative;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-badges {
      position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap;
    }
    .badge {
      padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 6px; color: white;
    }
    .badge-new { background: #3b82f6; }
    .badge-offer { background: #ef4444; }

    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card h3 { margin: 0; font-size: 16px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; }
    .price { font-weight: 800; color: var(--primary-dark); font-size: 16px; }
    .add-btn {
      padding: 8px 12px; border: none; border-radius: 10px;
      background: var(--primary); color: white; cursor: pointer; font-weight: 700;
    }

    /* Drawer Cart */
    .drawer {
      position: fixed; right: 16px; bottom: 16px; width: min(420px, calc(100% - 32px));
      background: white; border: 1px solid var(--border); border-radius: 18px;
      box-shadow: var(--shadow); display: none; overflow: hidden; z-index: 30;
    }
    .drawer.open { display: block; }
    .drawer-header, .drawer-footer { padding: 14px 16px; border-bottom: 1px solid var(--border); }
    .drawer-footer { border-bottom: none; border-top: 1px solid var(--border); display: grid; gap: 10px; }
    .drawer-body { max-height: 300px; overflow: auto; padding: 8px 16px; }
    .cart-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .qty-controls button { width: 26px; height: 26px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; }
    
    .action-btn { padding: 12px 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; text-align: center; }
    .whatsapp { background: var(--ok); color: white; }
    .secondary { background: var(--soft); color: var(--text); border: 1px solid var(--border); }
    .danger { background: var(--danger); color: white; }
    
    footer { border-top: 1px solid var(--border); background: var(--soft); margin-top: 40px; padding: 24px 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
  </style>
</head>
<body>
  <header>
    <div class="container topbar">
      <div class="brand">PURA</div>
      <label for="search" class="sr-only">Buscar productos</label>
      <input id="search" class="search" type="text" placeholder="Buscar productos..." />
      <div class="nav-actions">
        <button class="cart-btn" onclick="toggleCart()">Carrito (<span id="cartCount">0</span>)</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Elegí tus productos y enviá tu pedido por WhatsApp</h1>
      <p>Armá tu carrito, revisá el total y generá el mensaje listo para enviar a nuestra tienda.</p>
      <button onclick="document.getElementById('catalogo').scrollIntoView({ behavior: 'smooth' })">Ver catálogo</button>
    </div>
  </section>

  <main class="container">
    <div class="filters" id="filters"></div>

    <div class="section-title">
      <h2 id="catalogo">Catálogo</h2>
      <span id="resultCount"></span>
    </div>

    <div class="grid" id="productGrid"></div>
  </main>

  <footer>
    <div class="container" style="text-align:center;">
      <p style="color:var(--muted); font-size:14px; margin:0;">PURA - Pedí tus productos y envialos por WhatsApp.</p>
    </div>
  </footer>

  <!-- Drawer Cart -->
  <div class="drawer" id="cartDrawer">
    <div class="drawer-header"><strong>Tu carrito</strong></div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-footer">
      <div><strong>Total: $<span id="cartTotal">0</span></strong></div>
      <button class="action-btn whatsapp" onclick="showOrder()">Enviar pedido por WhatsApp</button>
      <button class="action-btn secondary" onclick="clearCart()">Vaciar carrito</button>
    </div>
  </div>

  <script>
    const WHATSAPP_NUMBER = "543484341158";
    const STORAGE_PRODUCTS = "pura_products_v2";
    const STORAGE_CATEGORIES = "pura_categories_v2";
    const STORAGE_CART = "pura_cart_v2";

    let defaultProducts = [
      { id: 1, name: "Shampoo Premium", price: 8500, category: "Shampoos", image: "", desc: "Limpieza profunda y brillo.", isNew: true, isOffer: false },
      { id: 2, name: "Cera Protectora", price: 9200, category: "Ceras", image: "", desc: "Protección y acabado brillante.", isNew: false, isOffer: true }
    ];

    let defaultCategories = ["Todos", "Shampoos", "Ceras", "Siliconas", "Limpieza", "Accesorios"];

    let products = [];
    let categories = [];
    let cart = [];
    let activeCategory = "Todos";

    function initData() {
      const savedProd = localStorage.getItem(STORAGE_PRODUCTS);
      products = savedProd ? JSON.parse(savedProd) : defaultProducts;

      const savedCat = localStorage.getItem(STORAGE_CATEGORIES);
      categories = savedCat ? JSON.parse(savedCat) : defaultCategories;

      const savedCart = localStorage.getItem(STORAGE_CART);
      cart = savedCart ? JSON.parse(savedCart) : [];
    }

    function saveCart() {
      localStorage.setItem(STORAGE_CART, JSON.stringify(cart));
    }

    const filtersEl = document.getElementById("filters");
    const gridEl = document.getElementById("productGrid");
    const searchEl = document.getElementById("search");
    const resultCountEl = document.getElementById("resultCount");
    const cartDrawer = document.getElementById("cartDrawer");
    const cartCountEl = document.getElementById("cartCount");
    const cartItemsEl = document.getElementById("cartItems");
    const cartTotalEl = document.getElementById("cartTotal");

    function formatPrice(n) {
      return Number(n).toLocaleString("es-AR");
    }

    function renderFilters() {
      filtersEl.innerHTML = categories.map(cat => `
        <button class="chip ${cat === activeCategory ? "active" : ""}" onclick="setCategory('${cat}')">${cat}</button>
      `).join("");
    }

    function renderProducts() {
      const q = searchEl.value.trim().toLowerCase();
      const filtered = products.filter(p => {
        const matchesCat = activeCategory === "Todos" || p.category === activeCategory;
        const matchesQuery = !q || p.name.toLowerCase().includes(q) || (p.desc && p.desc.toLowerCase().includes(q));
        return matchesCat && matchesQuery;
      });

      resultCountEl.textContent = `${filtered.length} producto${filtered.length !== 1 ? "s" : ""}`;

      gridEl.innerHTML = filtered.map(p => `
        <div class="card">
          <div class="card-img">
            <div class="card-badges">
              ${p.isNew ? '<span class="badge badge-new">NUEVO</span>' : ''}
              ${p.isOffer ? '<span class="badge badge-offer">OFERTA</span>' : ''}
            </div>
            ${p.image ? `<img src="${p.image}" alt="${p.name}">` : '<span style="font-size:36px;">📦</span>'}
          </div>
          <div class="card-body">
            <h3>${p.name}</h3>
            <p>${p.desc || ''}</p>
            <div class="price-row">
              <span class="price">$${formatPrice(p.price)}</span>
              <button class="add-btn" onclick="addToCart(${p.id})">Agregar</button>
            </div>
          </div>
        </div>
      `).join("") || `<div style="grid-column: 1/-1; text-align:center; color:var(--muted); padding:30px 0;">No encontramos productos</div>`;
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderFilters();
      renderProducts();
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const existing = cart.find(i => i.id === id);
      if (existing) existing.qty += 1;
      else cart.push({ ...product, qty: 1 });
      saveCart();
      renderCart();
      toggleCart(true);
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      saveCart();
      renderCart();
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) removeFromCart(id);
      else { saveCart(); renderCart(); }
    }

    function clearCart() {
      cart = [];
      saveCart();
      renderCart();
    }

    function toggleCart(forceOpen = null) {
      const shouldOpen = forceOpen === null ? !cartDrawer.classList.contains("open") : forceOpen;
      cartDrawer.classList.toggle("open", shouldOpen);
    }

    function renderCart() {
      const count = cart.reduce((acc, i) => acc + i.qty, 0);
      const total = cart.reduce((acc, i) => acc + i.qty * i.price, 0);

      cartCountEl.textContent = count;
      cartTotalEl.textContent = formatPrice(total);

      if (cart.length === 0) {
        cartItemsEl.innerHTML = `<div style="text-align:center; color:var(--muted); padding:20px 0;">Tu carrito está vacío</div>`;
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong>
            <div style="color:var(--muted); font-size:12px">$${formatPrice(item.price)} c/u</div>
            <div class="qty-controls">
              <button onclick="changeQty(${item.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)">+</button>
            </div>
          </div>
          <div style="text-align:right">
            <div><strong>$${formatPrice(item.qty * item.price)}</strong></div>
            <button class="secondary" style="margin-top:8px; padding:4px 8px; font-size:11px;" onclick="removeFromCart(${item.id})">Eliminar</button>
          </div>
        </div>
      `).join("");
    }

    function buildMessage() {
      const lines = cart.map(i => `- ${i.name} x${i.qty} ($${formatPrice(i.price * i.qty)})`).join("\n");
      const total = formatPrice(cart.reduce((acc, i) => acc + i.qty * i.price, 0));
      return `Hola, quiero hacer un pedido en PURA:\n\n${lines}\n\nTotal: $${total}\n\n¿Me confirmás disponibilidad?`;
    }

    function makeWhatsAppLink() {
      const message = buildMessage();
      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    function showOrder() {
      if (cart.length === 0) {
        alert("Tu carrito está vacío");
        return;
      }
      const url = makeWhatsAppLink();
      window.open(url, "_blank");
    }

    searchEl.addEventListener("input", renderProducts);
    initData();
    renderFilters();
    renderProducts();
    renderCart();
  </script>
</body>
</html>
